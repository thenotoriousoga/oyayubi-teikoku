<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe9d6">
  <title>ふわもちタワー</title>
  <meta name="description" content="タップでパンケーキを積むだけ。ずれても大丈夫、おかわりもある癒し系タワーゲーム。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-item"><span id="floors">0 だん</span></div>
    <div class="hud-item"><span id="okawari">🐦 💗💗</span></div>
    <div class="hud-item">ベスト <span id="best">—</span></div>
    <div class="hud-item target-item"><span id="target">🚩</span></div>
  </div>

  <div id="toast" class="hidden"></div>

  <div id="start-overlay" class="overlay">
    <div class="eyebrow">FUWA MOCHI TOWER</div>
    <h1 class="logo">ふわもちタワー</h1>
    <p class="logo-sub">🥞 つんで つんで 空のうえまで 🥞</p>
    <p class="rules">ゆらゆらしてるパンケーキを<br><b>タップでぽとん</b>と重ねるだけ。<br>おっこちても<b>小鳥がたすけてくれる</b>よ (2回まで)。<br>ライバルの旗をぜんぶこえて、てっぺんをめざせ!</p>
    <div class="entry-row">
      <input id="name-input" maxlength="10" placeholder="おなまえ (10文字まで)" autocomplete="off">
    </div>
    <div class="start-btns">
      <button id="show-rank-start" class="rank-btn">🏆 みんなのタワー</button>
    </div>
    <div class="tap-label">タップではじめる</div>
    <a id="back-portal" href="/">← ゲームせんたくに戻る</a>
  </div>

  <div id="over-overlay" class="overlay hidden">
    <h2 id="over-head">ごちそうさま!</h2>
    <div class="rank-title-wrap">
      <span class="rank-eyebrow">キミの称号</span>
      <div id="rank-title">たまごわり みならい</div>
    </div>
    <div class="over-score"><span id="over-floors">0</span> だん</div>
    <div class="over-best">ベスト <span id="over-best">—</span></div>
    <div id="over-comment">ふわふわのいいタワーだったよ</div>
    <div id="top10-badge" class="hidden">🌏 みんなのTOP10入り!</div>
    <div class="start-btns">
      <button id="show-rank-over" class="rank-btn">ランキングを見る</button>
      <button id="back-title" class="rank-btn">タイトルへ</button>
    </div>
    <div class="tap-label">タップでもういっかい</div>
  </div>

  <div id="rank-overlay" class="overlay hidden">
    <h2 class="rank-heading">🏆 みんなのタワー</h2>
    <p class="rank-sub">いちばん高くつんだ人たち TOP10</p>
    <ol id="rank-list"></ol>
    <div class="tap-label">タップで閉じる</div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
