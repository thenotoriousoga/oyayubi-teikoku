<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1c33">
  <title>PK対決!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-item">連続ゴール <span id="score">0</span></div>
    <div class="hud-item">ベスト <span id="best">0</span></div>
  </div>

  <div id="banner"></div>
  <div id="hint">⚽ を上にスワイプしてシュート!</div>

  <div id="start-overlay" class="overlay">
    <h1>PK対決!</h1>
    <p>スワイプでシュート!<br>キーパーをかわして連続ゴールを狙え。<br>速いスワイプほど強烈だが、コントロールが乱れるぞ。</p>
    <button id="show-rank-start" class="rank-btn">🏆 ランキング</button>
    <div class="tap-label">タップでスタート</div>
  </div>

  <div id="over-overlay" class="overlay hidden">
    <h2 id="over-reason">セーブされた!</h2>
    <div class="over-score">連続ゴール <span id="over-score">0</span></div>
    <div class="over-best">ベスト <span id="over-best">0</span></div>
    <div id="rank-entry" class="hidden">
      <input id="name-input" maxlength="10" placeholder="なまえ (10文字まで)" autocomplete="off">
      <button id="submit-score">🏆 ランキングに登録</button>
    </div>
    <button id="show-rank-over" class="rank-btn">ランキングを見る</button>
    <div class="tap-label">タップでリトライ</div>
  </div>

  <div id="rank-overlay" class="overlay hidden">
    <h2 class="rank-title">🏆 ランキング TOP10</h2>
    <ol id="rank-list"></ol>
    <div class="tap-label">タップで閉じる</div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
